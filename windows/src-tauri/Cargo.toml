[package]
name = "voicebridge"
version = "0.1.0"
description = "Android and Windows LAN text bridge"
authors = ["VoiceBridge contributors"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "voicebridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = "0.29.0"
futures-util = "0.3.34"
