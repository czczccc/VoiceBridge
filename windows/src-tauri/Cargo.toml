[package]
name = "voicebridge"
version = "0.1.0"
description = "Android and Windows LAN text bridge"
authors = ["VoiceBridge contributors"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "voicebridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = "0.29.0"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
futures-util = "0.3.34"
base64 = "0.22"
rand = "0.8"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"
subtle = "2.6"
